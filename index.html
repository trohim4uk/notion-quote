<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: transparent; /* Прозрачный фон под тему Notion */
      color: #37352f; /* Темно-серый текст (для светлой темы) */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    /* Автоматическая адаптация под темную тему Notion */
    @media (prefers-color-scheme: dark) {
      body { color: #e3e2e0; }
    }
    .card {
      border-left: 3px solid #eb5757;
      padding: 8px 16px;
      max-width: 600px;
      width: 100%;
    }
    .quote {
      font-size: 16px;
      line-height: 1.5;
      font-style: italic;
      margin-bottom: 8px;
    }
    .author {
      font-size: 13px;
      opacity: 0.7;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="quote" id="quote-text"></div>
    <div class="author" id="quote-author"></div>
  </div>

  <script>
    // ВПИШИТЕ СЮДА СВОИ ЦИТАТЫ
    const quotes = [
      { text: "Дисциплина — это решение делать то, чего очень не хочется делать, чтобы достичь того, чего очень хочется достичь.", author: "Джон Максвелл" },
      { text: "Маленькие шаги каждый день приводят к большим результатам.", author: "Неизвестный автор" },
      { text: "Не ждите идеального момента. Возьмите момент и сделайте его идеальным.", author: "Зои Сей" }
    ];

    // Вычисляем номер текущего дня с начала эпохи
    const msInDay = 1000 * 60 * 60 * 24;
    const todayIndex = Math.floor(Date.now() / msInDay);

    // Выбираем цитату по остатку от деления (идут по кругу)
    const dailyQuote = quotes[todayIndex % quotes.length];

    document.getElementById("quote-text").innerText = `«${dailyQuote.text}»`;
    document.getElementById("quote-author").innerText = `— ${dailyQuote.author}`;
  </script>

</body>
</html>
