<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: transparent;
      color: #37352f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e3e2e0; }
    }
    .card {
      border-left: 3px solid #eb5757;
      padding: 8px 16px;
      max-width: 600px;
      width: 100%;
    }
    .quote {
      font-size: 16px;
      line-height: 1.5;
      font-weight: 700; /* <--- ВОТ ЭТА СТРОЧКА СДЕЛАЛА ТЕКСТ ЖИРНЫМ */
      font-style: italic;
      margin-bottom: 8px;
    }
    .author {
      font-size: 13px;
      opacity: 0.7;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="quote" id="quote-text"></div>
    <div class="author" id="quote-author"></div>
  </div>

  <script>
    // ==========================================
    // ВАШ СПИСОК ЦИТАТ (РЕДАКТИРОВАТЬ ТОЛЬКО ТУТ)
    // ==========================================
    const quotes = [
      { text: "Если ты решишь не находить радость в снеге, радости у тебя будет меньше, а снега останется столько же.", author: "Древняя пословица" },
      { text: "Тревога — самое худшее применение, которое можно найти своему воображению.", author: "Дэн Задре" },
      { text: "Поскольку я — ничто, я могу воображать себя кем угодно. Если бы я был кем-то, я не мог бы этого делать.", author: "Фернандо Пессоа" }, 
      { text: "Все люди должны стремиться узнать ещё до своей смерти, от чего они бегут, к чему бегут и почему.", author: "Джеймс Тёрбер" },
      { text: "Посмотри на свои привычки, из которых складывается твоя повседневная жизнь: являются ли они результатом бесчисленных мелких проявлений трусости и лени или же твоего мужества и изобретательного разума?", author: "Фридрих Ницше" }
    ];
    // ==========================================

    const msInDay = 1000 * 60 * 60 * 24;
    const todayIndex = Math.floor(Date.now() / msInDay);
    const dailyQuote = quotes[todayIndex % quotes.length];

    document.getElementById("quote-text").innerText = `«${dailyQuote.text}»`;
    document.getElementById("quote-author").innerText = `— ${dailyQuote.author}`;
  </script>

</body>
</html>
